name: Deploy NVR.io

# Push to main → GitHub Actions can deploy.
# Primary path: Vercel Git Integration on ameenruks33-cyber/nvr-io
# (nvr-io-web + nvr-io-api). Keep Actions as a backup when secrets exist.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-nvr-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-git-deploy:
    name: Rely on Vercel Git auto-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm pipeline
        run: |
          echo "Commit ${{ github.sha }} pushed to ${{ github.ref_name }}."
          echo "Vercel Git Integration should deploy:"
          echo "  - nvr-io-web (monorepo root / Next.js)"
          echo "  - nvr-io-api (rootDirectory=backend)"
          echo "Cloudflare CDN updates when your domain CNAMEs to Vercel."

  deploy-web:
    name: Deploy web → Vercel (backup)
    runs-on: ubuntu-latest
    needs: notify-git-deploy
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
    steps:
      - name: Skip without Vercel token
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "::warning::VERCEL_TOKEN is not set — skipping backup web deploy."
          echo "If nvr-io-web.vercel.app is stale, add secrets (docs/DEPLOYMENT.md) and re-run this workflow,"
          echo "or redeploy from the Vercel dashboard → nvr-io-web → Deployments → Redeploy."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: env.VERCEL_TOKEN != ''
        run: npm install
      - name: Pull Vercel env
        if: env.VERCEL_TOKEN != ''
        run: npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        working-directory: .
      - name: Build
        if: env.VERCEL_TOKEN != ''
        run: npx vercel build --prod --token=$VERCEL_TOKEN
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-api:
    name: Deploy API → Vercel (backup)
    runs-on: ubuntu-latest
    needs: notify-git-deploy
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
    steps:
      - name: Skip without Vercel token
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::VERCEL_TOKEN is not set — skipping backup API deploy."

      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: "22"
          cache: npm
      - name: Install
        if: env.VERCEL_TOKEN != ''
        run: npm install
      - name: Generate Prisma
        if: env.VERCEL_TOKEN != ''
        run: npx prisma generate
        working-directory: backend
      - name: Deploy
        if: env.VERCEL_TOKEN != ''
        run: npx vercel deploy --prod --token=$VERCEL_TOKEN --cwd backend
