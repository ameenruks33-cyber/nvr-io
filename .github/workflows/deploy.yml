name: Deploy NVR.io

# Push to main → GitHub Actions can deploy.
# Primary path: Vercel Git Integration on ameenruks33-cyber/nvr-io
# (nvr-io-web + nvr-io-api). Keep Actions as a backup when secrets exist.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-nvr-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-git-deploy:
    name: Rely on Vercel Git auto-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm pipeline
        run: |
          echo "Commit ${{ github.sha }} pushed to ${{ github.ref_name }}."
          echo "Vercel Git Integration should deploy:"
          echo "  - nvr-io-web (monorepo root / Next.js)"
          echo "  - nvr-io-api (rootDirectory=backend)"
          echo "Cloudflare CDN updates when your domain CNAMEs to Vercel."

  deploy-web:
    name: Deploy web → Vercel (backup)
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    needs: notify-git-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install
      - name: Pull Vercel env
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: .
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      - name: Build
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      - name: Deploy
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}

  deploy-api:
    name: Deploy API → Vercel (backup)
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    runs-on: ubuntu-latest
    needs: notify-git-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm install
      - name: Generate Prisma
        run: npx prisma generate
        working-directory: backend
      - name: Deploy
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }} --cwd backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
